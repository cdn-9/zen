<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel En El Ring 🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;  /* Centra el contenido horizontalmente */
      align-items: center;      /* Centra el contenido verticalmente */
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer; /* Para que se vea que el área es clickeable */
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
    }

    video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Media Query para pantallas pequeñas (Móviles) */
    @media (max-width: 768px) {
      body {
        height: 100vh;
      }

      .video-container {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Botón de play -->
    <div class="play-button" onclick="playVideo()">►</div>
  </div>

  <script>
    let clickCount = 0; // Contador para hacer seguimiento de los clics

    // Función para abrir el enlace de Adsterra
    function openAd() {
      // Solo abrir el anuncio si el contador es menor a 2
      if (clickCount < 2) {
        window.location.href = "https://www.effectivegatecpm.com/ngzpt58f?key=5c70ad552b862af230af9bf451daf988"; // Redirige a la misma pestaña
        clickCount++; // Incrementa el contador de clics solo si el anuncio se abre
        localStorage.setItem('clickCount', clickCount); // Almacena el nuevo contador en localStorage
      }
    }

    // Función que maneja la reproducción del video y la apertura de anuncios
    function playVideo() {
      // Mostrar el anuncio en la misma ventana
      openAd(); // Abre el anuncio cuando el usuario hace clic en play

      // Abrir el video en una nueva pestaña
      const videoWindow = window.open("https://vidcool2.org/videos/w50.mp4", "_blank");

      // Después de 5 segundos, ocultar el anuncio en la ventana actual
      setTimeout(function() {
        // Se redirige al anuncio en la misma ventana después de un pequeño retraso
        videoWindow.onload = function() {
          const videoElement = videoWindow.document.querySelector("video");
          
          if (videoElement) {
            // Al terminar el video, mostrar otro anuncio de Adsterra en la ventana del video
            videoElement.addEventListener('ended', function() {
              videoWindow.location.href = "https://www.effectivegatecpm.com/ngzpt58f?key=5c70ad552b862af230af9bf451daf988"; // Mostrar otro anuncio
            });
          }
        };
      }, 5000); // Tiempo para mostrar el anuncio antes de redirigir (en ms)
    }
  </script>

</body>
</html>
