<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel En El Ring 🔥</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

.wrapper{
    display:flex;
    max-width:1200px;
    margin:40px auto;
    gap:30px;
    padding:0 15px;
}

.video-section{
    flex:3;
}

.video-container{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain; /* Cambié a 'contain' para evitar el recorte */
    display:none;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock-btn{
    background:#e50914;
    color:white;
    padding:14px 30px;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

.sidebar{
    flex:1;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.recommendation-box{
    background:#1a1a1a;
    padding:10px;
    border-radius:10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.recommendation-box img{
    width:100%;
    height:90px; /* Tamaño más adecuado */
    border-radius:8px;
    margin-bottom:10px;
    object-fit:cover;
    cursor:pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.recommendation-box:hover img {
    transform: scale(1.05); /* Efecto de zoom al pasar por encima */
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2); /* Sombra para hacerla más dinámica */
}

.recommendation-box a{
    color:#e50914;
    text-decoration:none;
    font-weight:bold;
    font-size:14px; /* Asegurando que el texto no sea tan grande */
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2; /* Limitar el texto a 2 líneas */
    -webkit-box-orient: vertical;
}

.recommendations-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 600px;
    overflow-y: auto;
    margin-right: 20px;
}

.recommendation-box {
    width: 180px; /* Ancho adecuado para las miniaturas */
    height: auto;
}

.telegram{
    background: #0088cc; /* Color azul para el botón de Telegram */
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-top:10px; /* Ajusté la separación */
}

.telegram a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.telegram-list {
    display: flex;
    flex-direction: column;
    gap: 10px; /* Ajusté la separación entre los botones */
}

.telegram-download {
    background: gold; /* Color dorado solo para el botón de descarga */
    color:black; /* Letras negras para el botón de descarga */
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

/* Media Query para pantallas pequeñas (Móviles) */
@media (max-width: 768px) {
    .wrapper {
        flex-direction: column;
        gap: 20px;
        margin: 20px;
    }

    .sidebar {
        flex: 1;
        width: 100%;
        max-height: 350px;
        overflow-y: scroll;
    }

    .recommendations-container {
        flex-direction: row;
        gap: 10px;
        overflow-x: scroll;
        max-height: 250px; /* Ajustamos la altura para que se vea bien en móvil */
        padding-bottom: 10px; /* Espacio para evitar que las miniaturas se corten */
    }

    .recommendation-box {
        width: 120px; /* Miniaturas más grandes en móvil */
        height: auto;
    }

    .telegram-download, .telegram {
        font-size: 14px;
        padding: 10px;
    }

    .video-container {
        width: 100%;
        aspect-ratio: 16/9;
        max-height: 80vh; /* Aumenta el tamaño del video en móvil */
        margin-bottom: 20px; /* Da más espacio entre el video y las recomendaciones */
    }

    video {
        width: 100%;
        height: 100%;
        object-fit:contain; /* Asegura que el video se ajuste correctamente */
    }
}
</style>
</head>

<body>

<div class="wrapper">

<div class="video-section">

<div class="video-container">

<iframe width="600" height="480" src="https://myvidplay.com/e/f4wf9syrs63g" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>

<div class="overlay" id="overlay">
<button class="unlock-btn" onclick="unlockVideo()">
🔓 Desbloquear Video
</button>
</div>

</div>

<!-- Moví el orden de los botones aquí -->
<div class="telegram-list">
    <div class="telegram-download" onclick="openAd()">
        DESCARGAR VIDEO CLICK AQUI 👉
    </div>

    <div class="telegram">
        <a href="https://t.me/angelenelring" target="_blank">
            Únete al grupo exclusivo 👉 @angelenelring
        </a>
    </div>
</div>

</div>

<div class="sidebar">

<!-- Contenedor para las recomendaciones de video (listado vertical) -->
<!-- Sección eliminada de recomendaciones -->

</div>

</div>

<script>
function unlockVideo(){
    // Abrir el enlace del anuncio cuando se presiona el botón "Desbloquear Video"
    window.open(
        "https://www.effectivegatecpm.com/ni03qhk9?key=372231298eb5e4e4f6e95a9f10a6e95e", 
        "_blank"
    );

    // Ocultar la capa de sobrecarga y el botón
    document.getElementById("overlay").style.display = "none";

    // Mostrar y reproducir el video
    var video = document.getElementById("miVideo");
    video.style.display = "block";
    video.play();
}

function openAd() {
    // Abrir el enlace del anuncio al hacer clic en el botón dorado de descarga
    window.open("https://www.effectivegatecpm.com/ni03qhk9?key=372231298eb5e4e4f6e95a9f10a6e95e", "_blank");
}
</script>

</body>
</html>
