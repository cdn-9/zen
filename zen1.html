<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel En El Ring 🔥</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

.wrapper{
    display:flex;
    max-width:1200px;
    margin:40px auto;
    gap:30px;
    padding:0 15px;
}

.video-section{
    flex:3;
}

.video-container{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    display:block;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
}

.unlock-btn{
    background:#e50914;
    color:white;
    padding:14px 30px;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

.play-button {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    border: none;
    font-size: 20px;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.play-button:hover {
    background: rgba(0, 0, 0, 0.85);
}

.sidebar{
    flex:1;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.telegram{
    background: #0088cc; /* Color azul para el botón de Telegram */
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-top:10px; /* Ajusté la separación */
}

.telegram a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.telegram-list {
    display: flex;
    flex-direction: column;
    gap: 10px; /* Ajusté la separación entre los botones */
}

.telegram-download {
    background: gold; /* Color dorado solo para el botón de descarga */
    color:black; /* Letras negras para el botón de descarga */
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

/* Media Query para pantallas pequeñas (Móviles) */
@media (max-width: 768px) {
    .wrapper {
        flex-direction: column;
        gap: 20px;
        margin: 20px;
    }

    .sidebar {
        flex: 1;
        width: 100%;
        max-height: 350px;
        overflow-y: scroll;
    }

    .telegram-download, .telegram {
        font-size: 14px;
        padding: 10px;
    }

    .video-container {
        width: 100%;
        aspect-ratio: 16/9;
        max-height: 80vh; /* Aumenta el tamaño del video en móvil */
        margin-bottom: 20px; /* Da más espacio entre el video y las recomendaciones */
    }

    iframe {
        width: 100%;
        height: 100%;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<div class="video-section">

<div class="video-container">
    <iframe width="600" height="480" src="https://myvidplay.com/e/f4wf9syrs63g" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>

    <!-- Botón de redirección sobre el video -->
    <button class="play-button" onclick="redirectToAd()">
        Haz clic aquí para desbloquear el video
    </button>

    <div class="overlay" id="overlay">
        <button class="unlock-btn" onclick="unlockVideo()">
            🔓 Desbloquear Video
        </button>
    </div>

</div>

<!-- Moví el orden de los botones aquí -->
<div class="telegram-list">
    <div class="telegram-download" onclick="openAd()">
        DESCARGAR VIDEO CLICK AQUI 👉
    </div>

    <div class="telegram">
        <a href="https://t.me/angelenelring" target="_blank">
            Únete al grupo exclusivo 👉 @angelenelring
        </a>
    </div>
</div>

</div>

<div class="sidebar">
    <!-- Ahora está vacío para mantenerlo limpio -->
</div>

</div>

<script>
function unlockVideo(){
    // Abrir el enlace del anuncio cuando se presiona el botón "Desbloquear Video"
    window.open(
        "https://www.effectivegatecpm.com/w8v228zp?key=570479220812effc1637181d77a766c7", 
        "_blank"
    );

    // Ocultar la capa de sobrecarga y el botón
    document.getElementById("overlay").style.display = "none";

    // Mostrar el video
    var video = document.querySelector('iframe');
    video.style.display = "block";
}

function redirectToAd() {
    // Redirigir al usuario al enlace de Adsterra
    window.open("https://www.effectivegatecpm.com/w8v228zp?key=570479220812effc1637181d77a766c7", "_blank");
}

function openAd() {
    // Abrir el enlace del anuncio al hacer clic en el botón dorado de descarga
    window.open("https://www.effectivegatecpm.com/w8v228zp?key=570479220812effc1637181d77a766c7", "_blank");
}
</script>

</body>
</html>
