<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel En El Ring 🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;  /* Centra el contenido horizontalmente */
      align-items: center;      /* Centra el contenido verticalmente */
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer; /* Para que se vea que el área es clickeable */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Media Query para pantallas pequeñas (Móviles) */
    @media (max-width: 768px) {
      body {
        height: 100vh;
      }

      .video-container {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Incrustación del video usando iframe -->
    <iframe id="videoIframe" src="https://vidcool2.org/videos/wicho2.mp4" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>
  </div>

  <script>
    let clickCount = 0; // Contador para hacer seguimiento de los clics

    // Obtener el iframe del video
    const videoIframe = document.getElementById('videoIframe');

    // Función para abrir el enlace de Adsterra
    function openAd() {
      // Si el contador es menor a 2, se redirige al enlace
      if (clickCount < 2) {
        window.location.href = "https://www.effectivegatecpm.com/w8v228zp?key=570479220812effc1637181d77a766c7"; // Redirige a la misma pestaña
        clickCount++; // Incrementa el contador de clics
      }
    }

    // Función para detectar cuando el video se haya pausado
    function onVideoPause() {
      if (clickCount < 2) {
        openAd(); // Llamamos la función para abrir el anuncio
      }
    }

    // Detectar cuando el video en el iframe se pausa
    videoIframe.addEventListener('click', function() {
      if (clickCount < 2) {
        openAd();
      }
    });

    // Usamos la API del iframe para manejar el control del video si el iframe contiene un elemento <video>
    let iframeDocument = videoIframe.contentWindow.document;

    iframeDocument.addEventListener('pause', function() {
      if (clickCount < 2) {
        openAd(); // Abrir anuncio solo si no se ha abierto 2 veces
      }
    });

  </script>

</body>
</html>
