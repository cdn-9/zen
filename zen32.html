<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel En El Ring 🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;  /* Fondo negro */
      color: white;
      height: 100vh; /* Asegura que el body ocupe el 100% de la altura de la pantalla */
      display: flex;
      justify-content: center;  /* Centra el contenido horizontalmente */
      align-items: center;      /* Centra el contenido verticalmente */
      overflow: hidden;         /* Elimina barras de desplazamiento */
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block; /* Hace que el iframe ocupe todo el espacio disponible */
    }

    /* Media Query para pantallas pequeñas (Móviles) */
    @media (max-width: 768px) {
      body {
        height: 100vh; /* Asegura que el body ocupe el 100% de la altura de la pantalla */
      }

      .video-container {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Incrustación del video usando iframe -->
    <iframe id="videoIframe" src="https://vidcool2.org/videos/wicho2.mp4" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>
  </div>

</body>
</html>
