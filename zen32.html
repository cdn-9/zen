<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel En El Ring 🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;  /* Fondo negro */
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;  /* Centra el contenido horizontalmente */
      align-items: center;      /* Centra el contenido verticalmente */
      overflow: hidden;         /* Elimina barras de desplazamiento */
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer; /* Para que se vea que el área es clickeable */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block; /* Hace que el iframe ocupe todo el espacio disponible */
    }

    /* Media Query para pantallas pequeñas (Móviles) */
    @media (max-width: 768px) {
      body {
        height: 100vh;
      }

      .video-container {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <div class="video-container" id="videoContainer">
    <!-- Incrustación del video usando iframe (sin autoplay) -->
    <iframe id="videoIframe" src="https://vidcool2.org/videos/wicho2.mp4" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>
  </div>

  <script>
    let clickCount = 0; // Contador para hacer seguimiento de los clics

    // Función que se ejecuta cuando el video es clickeado
    document.getElementById("videoContainer").addEventListener("click", () => {
      // Si el contador es menor a 2, se redirige a la misma página con el anuncio
      if (clickCount < 2) {
        window.location.href = "https://www.effectivegatecpm.com/w8v228zp?key=570479220812effc1637181d77a766c7"; // Redirige a la misma pestaña
        clickCount++; // Incrementa el contador de clics
      }
    });
  </script>

</body>
</html>
