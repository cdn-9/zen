<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel En El Ring 🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('https://ia600700.us.archive.org/11/items/617585534-122178043004430999-8912214144732430590-n/617585534_122178043004430999_8912214144732430590_n.jpg'); /* Imagen de fondo */
      background-size: contain; /* La imagen se ajusta completamente sin recortes */
      background-position: center; /* Centra la imagen */
      background-repeat: no-repeat; /* Evita que la imagen se repita */
      color: white;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block; /* Mostramos el iframe */
    }

    /* Media Query para pantallas pequeñas (Móviles) */
    @media (max-width: 768px) {
      .video-container {
        max-width: 100%;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Incrustación del video usando iframe -->
    <iframe id="videoIframe" src="https://vidcool2.org/videos/wicho2.mp4" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>
  </div>

</body>
</html>
